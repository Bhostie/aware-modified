// Top-level build file where you can add configuration options common to all sub-projects/modules.
// NOTE: This project uses AGP 4.1.1 (see build_gradle var below) which is NOT compatible with running on JDK 21.
// Use JDK 11 or 17 with the current Gradle wrapper (7.2) or follow BUILDING.md for upgrade paths.
buildscript {
    ext {
        mqtt_libs = '1.2.1'
        ion_libs = "2.+"
        google_libs = "17.0.0"
        version_code = 6
        version_readable = "4.1." + version_code + ".light.bundle"
        compile_sdk = 28
        target_sdk = 28
        minimum_sdk = 24
        build_tools = "28.0.3"
        aware_libs = "master-SNAPSHOT"
        kotlin_version = "1.3.41"
        build_gradle = '4.1.1'
    }

    repositories {
        maven {
            url 'https://maven.google.com'
        }
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
        maven { url "https://repo.eclipse.org/content/repositories/paho-releases/" } // For Eclipse Paho MQTT
    }
    dependencies {
        classpath "com.android.tools.build:gradle:${build_gradle}"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        maven {
            url 'https://maven.google.com'
        }
        google()
        mavenCentral()
        maven { url "https://jitpack.io" } //MPAndroidChart, AWARE
        maven { url "https://repo.eclipse.org/content/repositories/paho-releases/" } // For Eclipse Paho MQTT
    }
}
